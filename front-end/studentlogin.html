<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student access | Learning Center</title>
    <link rel="stylesheet" href="style.css">
    <script src="role-auth.js" defer></script>
    <script src="student.js" defer></script>
</head>
<body>
    <main class="page-shell auth-shell">
        <header class="brand"><a class="brand-mark" href="index.html" aria-label="Learning Center home">LC</a><span>Learning Center</span></header>
        <a class="back-link" href="index.html">&#8592; All account types</a>
        <section class="auth-layout" aria-labelledby="auth-title">
            <div class="auth-intro">
                <p class="eyebrow">STUDENT PORTAL</p>
                <h1 id="auth-title">Your next step<br>starts here.</h1>
                <p>Create a student account or sign in to continue learning.</p>
            </div>
            <div class="auth-panel">
                <div class="tab-list" role="tablist" aria-label="Student account actions">
                    <button class="tab-button is-active" type="button" role="tab" aria-selected="true" aria-controls="register-panel" data-panel="register-panel">Register</button>
                    <button class="tab-button" type="button" role="tab" aria-selected="false" aria-controls="login-panel" data-panel="login-panel">Sign in</button>
                </div>
                <p class="form-message" id="form-message" role="status" aria-live="polite" hidden></p>
                <section id="register-panel" class="form-panel" role="tabpanel">
                    <h2>Create student account</h2>
                    <form id="register-form">
                        <label for="register-first-name">First name</label>
                        <input id="register-first-name" name="firstName" autocomplete="given-name" required>
                        <label for="register-last-name">Last name</label>
                        <input id="register-last-name" name="lastName" autocomplete="family-name" required>
                        <label for="register-user-id">Username</label>
                        <input id="register-user-id" name="userID" autocomplete="username" required>
                        <label for="register-phone">Phone number</label>
                        <input id="register-phone" name="phone" type="tel" autocomplete="tel" required>
                        <label for="register-parent-phone">Parent or guardian phone</label>
                        <input id="register-parent-phone" name="parentPhone" type="tel" required>
                        <label for="register-grade">Grade</label>
                        <select id="register-grade" name="grade" required>
                            <option value="" selected disabled>Select your grade</option>
                            <option value="0">S1</option>
                            <option value="1">S2</option>
                            <option value="2">S3</option>
                        </select>
                        <label for="register-school">School name</label>
                        <input id="register-school" name="schoolName" autocomplete="organization" required>
                        <label for="register-language">Learning language</label>
                        <select id="register-language" name="learningLanguage" required>
                            <option value="" selected disabled>Select a language</option>
                            <option value="0">Arabic</option>
                            <option value="1">English</option>
                        </select>
                        <label for="register-password">Password</label>
                        <input id="register-password" name="password" type="password" autocomplete="new-password" minlength="8" required>
                        <label for="register-confirm">Confirm password</label>
                        <input id="register-confirm" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
                        <button class="submit-button" type="submit">Create account <span aria-hidden="true">&#8594;</span></button>
                    </form>
                    <section id="student-credentials" class="student-credentials" aria-live="polite" hidden>
                        <h3>Your student number</h3>
                        <p id="student-id-value" class="student-id-value"></p>
                        <p>Keep this number to sign in. You can also scan the QR code.</p>
                        <img id="student-id-qr" class="student-id-qr" alt="QR code for your student number">
                    </section>
                </section>
                <section id="login-panel" class="form-panel" role="tabpanel" hidden>
                    <h2>Welcome back</h2>
                    <form id="login-form">
                        <label for="login-identifier">Username or phone number</label>
                        <input id="login-identifier" name="identifier" autocomplete="username" required>
                        <label for="login-password">Password</label>
                        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
                        <button class="submit-button" type="submit">Sign in <span aria-hidden="true">&#8594;</span></button>
                    </form>
                </section>
            </div>
        </section>
    </main>
</body>
</html>
